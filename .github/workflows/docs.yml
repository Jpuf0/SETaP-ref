name: Docs
on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  build-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install

      - name: Build documentation
        working-directory: backend
        run: bun run docs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: backend/docs
